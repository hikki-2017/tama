<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 380" width="240" height="380">
  <defs>
    <radialGradient id="aoi-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a5a9a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a1a3a" stop-opacity="0.1"/>
    </radialGradient>
    <radialGradient id="aoi-skin" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fce4d6"/>
      <stop offset="100%" stop-color="#e8cfc0"/>
    </radialGradient>
    <linearGradient id="aoi-hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ab8e8"/>
      <stop offset="40%" stop-color="#4a8fd4"/>
      <stop offset="100%" stop-color="#2a5a9a"/>
    </linearGradient>
    <linearGradient id="aoi-blazer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0e1a30"/>
    </linearGradient>
    <radialGradient id="aoi-eye-iris" cx="45%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6ac0ff"/>
      <stop offset="60%" stop-color="#2a6ac0"/>
      <stop offset="100%" stop-color="#1a3a6a"/>
    </radialGradient>
    <filter id="aoi-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.5  0 0 0 0 0.9  0 0 0 0.4 0" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="aoi-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a3060" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background aura -->
  <rect width="240" height="380" fill="url(#aoi-bg)" rx="8"/>
  <ellipse cx="120" cy="160" rx="90" ry="120" fill="#4488ff" opacity="0.06"/>

  <!-- Body / Blazer -->
  <g filter="url(#aoi-shadow)">
    <!-- Shoulders and torso -->
    <path d="M50,280 Q50,255 75,245 L95,238 Q120,232 145,238 L165,245 Q190,255 190,280 L195,380 L45,380 Z" fill="url(#aoi-blazer)"/>
    <!-- Blazer lapels -->
    <path d="M95,238 L110,270 L120,380" fill="none" stroke="#2a3a5a" stroke-width="1.5"/>
    <path d="M145,238 L130,270 L120,380" fill="none" stroke="#2a3a5a" stroke-width="1.5"/>
    <!-- White shirt visible -->
    <path d="M95,238 L110,270 L120,310 L130,270 L145,238 Q130,234 120,233 Q110,234 95,238Z" fill="#eef2f8"/>
    <!-- Shirt collar lines -->
    <path d="M105,242 L113,260" fill="none" stroke="#d0d8e4" stroke-width="0.8"/>
    <path d="M135,242 L127,260" fill="none" stroke="#d0d8e4" stroke-width="0.8"/>
    <!-- Tie -->
    <path d="M117,255 L120,258 L123,255 L121,300 L120,305 L119,300Z" fill="#2a5a9a" opacity="0.9"/>
  </g>

  <!-- Neck -->
  <path d="M107,225 L107,240 Q120,248 133,240 L133,225 Q125,232 115,232 Z" fill="url(#aoi-skin)"/>
  <path d="M112,232 Q120,236 128,232" fill="none" stroke="#d4b8a8" stroke-width="0.5" opacity="0.5"/>

  <!-- Head shape -->
  <g filter="url(#aoi-glow)">
    <ellipse cx="120" cy="165" rx="52" ry="65" fill="url(#aoi-skin)"/>
  </g>

  <!-- Ears -->
  <ellipse cx="70" cy="170" rx="8" ry="12" fill="#ecd4c4"/>
  <ellipse cx="70" cy="170" rx="5" ry="8" fill="#e0c4b4"/>
  <ellipse cx="170" cy="170" rx="8" ry="12" fill="#ecd4c4"/>
  <ellipse cx="170" cy="170" rx="5" ry="8" fill="#e0c4b4"/>

  <!-- Hair back layer -->
  <path d="M62,120 Q60,160 65,200 Q62,210 68,215 L68,180 Q70,140 80,120Z" fill="#3a6aaa" opacity="0.8"/>
  <path d="M178,120 Q180,160 175,200 Q178,210 172,215 L172,180 Q170,140 160,120Z" fill="#3a6aaa" opacity="0.8"/>

  <!-- Hair main -->
  <path d="M68,140 Q65,110 80,90 Q95,75 120,72 Q145,75 160,90 Q175,110 172,140
           Q172,120 165,108 Q155,95 120,90 Q85,95 75,108 Q68,120 68,140Z"
        fill="url(#aoi-hair)"/>
  <!-- Hair top volume -->
  <path d="M75,130 Q70,105 85,88 Q100,74 120,70 Q140,74 155,88 Q170,105 165,130
           Q168,110 158,95 Q145,80 120,77 Q95,80 82,95 Q72,110 75,130Z"
        fill="#8ac0ee" opacity="0.7"/>
  <!-- Side hair strands -->
  <path d="M72,135 Q68,155 70,185 Q67,195 72,200" fill="none" stroke="#5a90c8" stroke-width="5" stroke-linecap="round"/>
  <path d="M168,135 Q172,155 170,185 Q173,195 168,200" fill="none" stroke="#5a90c8" stroke-width="5" stroke-linecap="round"/>
  <!-- Bangs - slightly messy -->
  <path d="M78,130 Q85,115 95,128 Q100,110 110,126 Q115,108 125,124 Q130,106 140,122 Q148,108 155,126 Q160,115 162,130
           Q165,115 158,100 Q148,88 120,85 Q92,88 82,100 Q75,115 78,130Z"
        fill="url(#aoi-hair)"/>
  <!-- Hair highlight streaks -->
  <path d="M95,95 Q100,108 98,125" fill="none" stroke="#a0d4f8" stroke-width="1.5" opacity="0.6"/>
  <path d="M130,93 Q132,106 128,120" fill="none" stroke="#a0d4f8" stroke-width="1.5" opacity="0.6"/>
  <path d="M110,90 Q112,105 108,122" fill="none" stroke="#b0dcff" stroke-width="1" opacity="0.4"/>

  <!-- Eyebrows -->
  <path d="M89,147 Q98,142 107,145" fill="none" stroke="#3a5a80" stroke-width="2" stroke-linecap="round"/>
  <path d="M133,145 Q142,142 151,147" fill="none" stroke="#3a5a80" stroke-width="2" stroke-linecap="round"/>

  <!-- Eyes -->
  <!-- Left eye -->
  <g>
    <ellipse cx="98" cy="163" rx="14" ry="12" fill="#fff"/>
    <ellipse cx="98" cy="164" rx="10" ry="10" fill="url(#aoi-eye-iris)"/>
    <circle cx="98" cy="164" r="5" fill="#0a2040"/>
    <circle cx="93" cy="159" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="101" cy="167" r="1.5" fill="#fff" opacity="0.5"/>
    <path d="M84,160 Q90,155 98,155 Q106,155 112,160" fill="none" stroke="#2a4060" stroke-width="1.5"/>
    <path d="M86,166 Q92,172 98,172 Q104,172 110,166" fill="none" stroke="#2a4060" stroke-width="1"/>
    <!-- Eyelashes -->
    <path d="M84,160 Q82,157 80,156" fill="none" stroke="#2a4060" stroke-width="1"/>
  </g>
  <!-- Right eye -->
  <g>
    <ellipse cx="142" cy="163" rx="14" ry="12" fill="#fff"/>
    <ellipse cx="142" cy="164" rx="10" ry="10" fill="url(#aoi-eye-iris)"/>
    <circle cx="142" cy="164" r="5" fill="#0a2040"/>
    <circle cx="137" cy="159" r="3" fill="#fff" opacity="0.9"/>
    <circle cx="145" cy="167" r="1.5" fill="#fff" opacity="0.5"/>
    <path d="M128,160 Q134,155 142,155 Q150,155 156,160" fill="none" stroke="#2a4060" stroke-width="1.5"/>
    <path d="M130,166 Q136,172 142,172 Q148,172 154,166" fill="none" stroke="#2a4060" stroke-width="1"/>
    <path d="M156,160 Q158,157 160,156" fill="none" stroke="#2a4060" stroke-width="1"/>
  </g>

  <!-- Nose -->
  <path d="M118,178 Q120,182 122,178" fill="none" stroke="#d4b0a0" stroke-width="1" stroke-linecap="round"/>

  <!-- Mouth - thoughtful, slight closed -->
  <path d="M110,196 Q115,194 120,195 Q125,194 130,196" fill="none" stroke="#c08878" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M113,196 Q120,199 127,196" fill="#d4a090" opacity="0.3"/>

  <!-- Subtle blush -->
  <ellipse cx="88" cy="178" rx="10" ry="5" fill="#e8a0a0" opacity="0.15"/>
  <ellipse cx="152" cy="178" rx="10" ry="5" fill="#e8a0a0" opacity="0.15"/>

  <!-- Chin definition -->
  <path d="M100,215 Q120,228 140,215" fill="none" stroke="#d8c0b0" stroke-width="0.5" opacity="0.4"/>
</svg>